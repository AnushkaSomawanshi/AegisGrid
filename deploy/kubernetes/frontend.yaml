apiVersion: v1
kind: Service
metadata:
  name: aegisgrid-frontend
spec:
  selector:
    app: aegisgrid-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisgrid-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegisgrid-frontend
  template:
    metadata:
      labels:
        app: aegisgrid-frontend
    spec:
      containers:
        - name: frontend
          image: aegisgrid-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
