apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisgrid-outbox-dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegisgrid-outbox-dispatcher
  template:
    metadata:
      labels:
        app: aegisgrid-outbox-dispatcher
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432 && nc -z rabbitmq 5672; do sleep 2; done"]
      containers:
        - name: dispatcher
          image: aegisgrid-api:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.outbox_dispatcher"]
          envFrom:
            - configMapRef:
                name: aegisgrid-config
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://aegisgrid:$(POSTGRES_PASSWORD)@postgres:5432/aegisgrid
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegisgrid-runtime-secrets
                  key: POSTGRES_PASSWORD
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: aegisgrid-runtime-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegisgrid-runtime-secrets
                  key: RABBITMQ_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
