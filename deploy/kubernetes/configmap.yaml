apiVersion: v1
kind: ConfigMap
metadata:
  name: aegisgrid-config
data:
  POSTGRES_DB: aegisgrid
  POSTGRES_USER: aegisgrid
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  AEGISGRID_DEPLOYMENT_TARGET: kubernetes-local
  CORS_ORIGINS: http://localhost:3000
  OUTBOX_POLL_SECONDS: "3"
