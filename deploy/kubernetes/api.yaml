apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisgrid-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432 && nc -z rabbitmq 5672; do echo waiting for postgres/rabbitmq; sleep 2; done"]
      containers:
        - name: api
          image: aegisgrid-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: aegisgrid-config
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://aegisgrid:$(POSTGRES_PASSWORD)@postgres:5432/aegisgrid
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegisgrid-runtime-secrets
                  key: POSTGRES_PASSWORD
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: aegisgrid-runtime-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegisgrid-runtime-secrets
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
