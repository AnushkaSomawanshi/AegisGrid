<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 993" role="img" aria-labelledby="title desc">
<title id="title">AegisGrid illustrative operational response map</title><desc id="desc">Dark blue street network, river, zones, incident markers, service hubs, response vehicles and route overlays. Illustrative demonstration artwork, not live geospatial data.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#061b31"/><stop offset="1" stop-color="#061426"/></linearGradient>
 <pattern id="blocks" width="78" height="62" patternUnits="userSpaceOnUse"><path d="M3 4H31V22H3ZM39 5H72V17H39ZM12 31H45V56H12ZM52 27H74V53H52Z" fill="#0b2a43" stroke="#125075" stroke-width="1.2"/><path d="M0 27H78M34 0V62" stroke="#0b4264" stroke-width="2"/></pattern>
 <pattern id="streets" width="46" height="42" patternUnits="userSpaceOnUse"><path d="M0 8H46M0 34H46M8 0V42M36 0V42" stroke="#17618a" stroke-width="2" fill="none"/><path d="M0 21H46M22 0V42" stroke="#0d3d61" stroke-width="1.2"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <g id="critical"><circle r="25" fill="#ff425d" opacity=".18"/><path d="M0-23 20 11H-20Z" fill="#ff3857" stroke="#fff" stroke-width="3"/><path d="M0-12V0M0 7V9" stroke="#07182b" stroke-width="4" stroke-linecap="round"/></g>
 <g id="high"><circle r="29" fill="#ff9d2e" opacity=".18"/><path d="M0-23 22 0 0 23-22 0Z" fill="#ff9227" stroke="#fff" stroke-width="3"/><path d="M-7 4 0-9 7 4M-4 0H4" stroke="#fff" stroke-width="2" fill="none"/></g>
 <g id="hub"><circle r="22" fill="#062238" stroke="#05d9ef" stroke-width="3"/><path d="M-9-8H9V8H-9ZM-4-13V-8M4-13V-8M0 8V13" fill="none" stroke="#21e8f5" stroke-width="3"/></g>
 <g id="car"><rect x="-24" y="-13" width="48" height="26" rx="7" fill="#032b45" stroke="#19e6f5" stroke-width="2"/><path d="M-13-6H8L16 0H-17Z" fill="#10c7e8"/><circle cx="-13" cy="9" r="4" fill="#c9faff"/><circle cx="14" cy="9" r="4" fill="#c9faff"/></g>
</defs>
<rect width="1584" height="993" fill="url(#bg)"/><rect width="1584" height="993" fill="url(#blocks)" opacity=".95"/><rect width="1584" height="993" fill="url(#streets)" opacity=".7"/>
<!-- district green spaces -->
<path d="M0 90 110 32 220 72 180 190 80 244 0 208Z M1240 0H1515L1584 118 1480 178 1325 124Z M0 720 180 665 260 760 210 993H0Z" fill="#073e42" opacity=".62" stroke="#0f857f" stroke-width="3"/>
<!-- river and bridges -->
<path d="M-60 265 C180 330 250 180 440 250 S720 400 890 295 1150 120 1280 255 1450 510 1640 430" fill="none" stroke="#063a67" stroke-width="104"/>
<path d="M-60 265 C180 330 250 180 440 250 S720 400 890 295 1150 120 1280 255 1450 510 1640 430" fill="none" stroke="#0874b8" stroke-width="72"/>
<path d="M-60 265 C180 330 250 180 440 250 S720 400 890 295 1150 120 1280 255 1450 510 1640 430" fill="none" stroke="#1397d8" stroke-width="3" opacity=".7"/>
<g stroke="#ffb21f" stroke-width="6" stroke-dasharray="16 10" fill="none"><path d="M0 150 210 300 420 355 640 490 820 520 1000 690 1200 810 1584 900"/><path d="M260 0 360 170 550 250 720 180 920 0"/><path d="M1050 0 980 180 1020 320 940 470 1040 620 1000 800"/></g>
<g stroke="#08e6f5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"><path d="M170 425 260 460 335 450 420 505 490 590 590 565 680 530 820 510"/><path d="M820 510 900 570 1000 610 1100 700 1190 740"/><path d="M540 340 600 390 680 430 820 510"/></g>
<g stroke="#42baff" stroke-width="3" fill="none" opacity=".9"><path d="M40 480 210 510 350 620 500 650 680 630 810 700 960 740 1080 900"/><path d="M120 120 260 200 410 170 540 220 680 170 840 210 1000 130 1190 200 1450 160"/><path d="M250 820 420 760 590 810 720 760 890 820 1040 770 1250 850 1490 790"/></g>
<!-- zone boundaries -->
<path d="M80 110 540 80 730 310 650 590 250 620 90 420Z" fill="none" stroke="#27d4cc" stroke-width="3" stroke-dasharray="8 10" opacity=".75"/>
<path d="M730 310 1030 170 1280 320 1320 700 1010 800 650 590Z" fill="none" stroke="#27d4cc" stroke-width="3" stroke-dasharray="8 10" opacity=".75"/>
<path d="M1280 320 1510 280 1584 600 1500 850 1320 700Z" fill="none" stroke="#27d4cc" stroke-width="3" stroke-dasharray="8 10" opacity=".75"/>
<g font-family="Arial,sans-serif" fill="#a5c9f4" opacity=".9"><text x="240" y="145" font-size="36" font-weight="700" letter-spacing="5">ZONE A</text><text x="240" y="178" font-size="21">North District</text><text x="820" y="380" font-size="36" font-weight="700" letter-spacing="5">ZONE B</text><text x="820" y="414" font-size="21">Central District</text><text x="1360" y="330" font-size="36" font-weight="700" letter-spacing="5">ZONE C</text><text x="1360" y="364" font-size="21">East District</text><text x="980" y="235" font-size="23" fill="#1ad7ff" transform="rotate(14 980 235)">Riverside River</text></g>
<!-- incident labels -->
<g font-family="Arial,sans-serif"><use href="#critical" x="425" y="235" filter="url(#glow)"/><rect x="458" y="194" width="230" height="92" rx="13" fill="#061425" stroke="#24516d" stroke-width="2"/><text x="480" y="224" fill="#fff" font-size="22" font-weight="700">INC-1043</text><text x="480" y="251" fill="#e1efff" font-size="19">Medical evacuation</text><rect x="480" y="260" width="94" height="22" rx="8" fill="#401b2b" stroke="#ff405d"/><text x="491" y="276" fill="#ff6576" font-size="15" font-weight="700">CRITICAL</text>
<use href="#high" x="825" y="515" filter="url(#glow)"/><rect x="862" y="474" width="245" height="96" rx="13" fill="#061425" stroke="#24516d" stroke-width="2"/><text x="885" y="505" fill="#fff" font-size="22" font-weight="700">INC-1042</text><text x="885" y="533" fill="#e1efff" font-size="19">Flooded underpass</text><rect x="885" y="541" width="72" height="22" rx="8" fill="#3b2814" stroke="#ff9d2e"/><text x="897" y="557" fill="#ffb24c" font-size="15" font-weight="700">HIGH</text>
<use href="#high" x="1195" y="150"/><rect x="1230" y="115" width="205" height="78" rx="12" fill="#061425" stroke="#24516d" stroke-width="2"/><text x="1250" y="145" fill="#fff" font-size="21" font-weight="700">INC-1044</text><text x="1250" y="173" fill="#e1efff" font-size="19">Power failure</text>
<use href="#critical" x="1190" y="730"/><rect x="1228" y="694" width="220" height="86" rx="12" fill="#061425" stroke="#24516d" stroke-width="2"/><text x="1250" y="724" fill="#fff" font-size="21" font-weight="700">INC-1045</text><text x="1250" y="751" fill="#e1efff" font-size="18">Fire · building</text>
</g>
<!-- service hubs and vehicle labels -->
<use href="#hub" x="170" y="425"/><use href="#hub" x="1390" y="450"/><use href="#car" x="620" y="565"/><use href="#car" x="1020" y="615"/><use href="#car" x="560" y="340"/>
<g font-family="Arial,sans-serif" font-size="16" fill="#e6f7ff"><rect x="112" y="458" width="124" height="42" rx="8" fill="#061425" stroke="#24516d"/><text x="127" y="484">Service Hub West</text><rect x="1420" y="475" width="145" height="42" rx="8" fill="#061425" stroke="#24516d"/><text x="1435" y="501">Service Hub East</text><rect x="574" y="298" width="140" height="32" rx="7" fill="#061425" stroke="#24516d"/><text x="588" y="319">U-01 Ambulance</text><rect x="1038" y="640" width="132" height="32" rx="7" fill="#061425" stroke="#24516d"/><text x="1050" y="661">U-02 Fire Unit</text><rect x="575" y="600" width="100" height="32" rx="7" fill="#061425" stroke="#24516d"/><text x="588" y="621">U-03 Rescue</text></g>
<!-- legend and scale -->
<g font-family="Arial,sans-serif"><rect x="18" y="790" width="505" height="180" rx="14" fill="#041221" stroke="#1b4564" stroke-width="2" opacity=".97"/><circle cx="48" cy="827" r="11" fill="#ff425d"/><text x="73" y="834" fill="#cfe5ff" font-size="17">Critical incident</text><circle cx="48" cy="865" r="11" fill="#ff9d2e"/><text x="73" y="872" fill="#cfe5ff" font-size="17">High priority</text><circle cx="48" cy="903" r="11" fill="#0edcf0"/><text x="73" y="910" fill="#cfe5ff" font-size="17">Medium priority</text><use href="#car" x="275" y="827" transform="translate(275 827) scale(.45) translate(-275 -827)"/><text x="305" y="834" fill="#cfe5ff" font-size="17">Response unit</text><use href="#hub" x="275" y="865" transform="translate(275 865) scale(.45) translate(-275 -865)"/><text x="305" y="872" fill="#cfe5ff" font-size="17">Service hub</text><path d="M260 903H295" stroke="#ff9d2e" stroke-width="4" stroke-dasharray="8 5"/><text x="305" y="910" fill="#cfe5ff" font-size="17">Alternate route</text><path d="M260 941H295" stroke="#0edcf0" stroke-width="5"/><text x="305" y="948" fill="#cfe5ff" font-size="17">Primary route</text>
<rect x="1170" y="900" width="390" height="70" rx="12" fill="#041221" stroke="#1b4564" stroke-width="2"/><path d="M1195 943H1515" stroke="#e6f5ff" stroke-width="4"/><path d="M1195 934V950M1275 934V950M1355 934V950M1435 934V950M1515 934V950" stroke="#e6f5ff" stroke-width="3"/><text x="1190" y="926" fill="#e6f5ff" font-size="15">0</text><text x="1268" y="926" fill="#e6f5ff" font-size="15">1</text><text x="1348" y="926" fill="#e6f5ff" font-size="15">2</text><text x="1428" y="926" fill="#e6f5ff" font-size="15">4</text><text x="1505" y="926" fill="#e6f5ff" font-size="15">6 km</text></g>
<g transform="translate(48 50)"><circle r="28" fill="#07192b" stroke="#d5eaff" stroke-width="2"/><text x="-7" y="-5" fill="#fff" font-size="17" font-weight="700">N</text><path d="M0 1-10 18 0 13 10 18Z" fill="#eaf7ff"/></g>
<text x="790" y="970" fill="#7294b2" font-family="Arial,sans-serif" font-size="12">ILLUSTRATIVE MAP ART · SYNTHETIC LOCATIONS AND ROUTES · NOT LIVE GIS DATA</text>
</svg>