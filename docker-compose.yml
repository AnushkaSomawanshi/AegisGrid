services:
  postgres:
    image: postgres:16-alpine
    container_name: aegisgrid-postgres
    environment:
      POSTGRES_DB: aegisgrid
      POSTGRES_USER: aegisgrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    ports:
      - "5433:5432"
    volumes:
      - aegisgrid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisgrid -d aegisgrid"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [aegisgrid]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: aegisgrid-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [aegisgrid]

  api:
    build:
      context: ./services/api
    container_name: aegisgrid-api
    environment:
      DATABASE_URL: postgresql://aegisgrid:${POSTGRES_PASSWORD:-local-dev-only-change-me}@postgres:5432/aegisgrid
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [aegisgrid]

  frontend:
    build:
      context: ./frontend
    container_name: aegisgrid-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [aegisgrid]

volumes:
  aegisgrid_pgdata:

networks:
  aegisgrid:
    driver: bridge
